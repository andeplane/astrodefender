name: Client

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'client/**'
      - 'engine/**'
      - '.github/workflows/client.yaml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Fails below the coverage thresholds in vite.config.ts.
      - run: npm test
      - run: npm run build
